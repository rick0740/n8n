<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYNMOSA 健喬信元 — 智慧助理</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* 完整保留您原始的 CSS 變數與基礎樣式 */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f2f5; --sidebar: #ffffff; --border: #e2e8f0; --accent: #0077b6;
      --accent-lt: #e6f3fb; --accent-2: #00b4d8; --text: #1a202c; --text-mid: #4a5568;
      --text-dim: #a0aec0; --bubble-ai: #f7f9fc; --bubble-usr: #0077b6;
      --success: #38a169; --danger: #e53e3e; --radius: 12px;
    }
    html, body { height: 100%; font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    .layout { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
    .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
    .sidebar-header { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
    .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .brand-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; flex-shrink: 0; }
    .brand-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: 0.05em; }
    .brand-sub { font-size: 11px; color: var(--text-dim); margin-left: 42px; }
    .user-card { margin: 16px 20px; background: var(--accent-lt); border: 1px solid rgba(0,119,182,0.15); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 500; color: var(--accent); }
    .user-role { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

    .sidebar-nav { flex: 1; padding: 8px 12px; overflow-y: auto; }
    .nav-section-label { font-size: 10px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 8px 6px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-mid); transition: background 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: var(--accent-lt); color: var(--accent); font-weight: 500; }
    .nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .nav-badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-family: 'JetBrains Mono', monospace; }

    .main { display: flex; flex-direction: column; height: 100vh; background: #fff; }
    .main-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .status-pill { display: flex; align-items: center; gap: 6px; background: #f0fff4; border: 1px solid rgba(56,161,105,0.2); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: var(--success); font-weight: 500; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* 🆕 新增：生技分析專用面板樣式 */
    .analysis-panel { display: none; flex: 1; padding: 40px 24px; flex-direction: column; align-items: center; overflow-y: auto; background: #fff; }
    .analysis-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 100%; max-width: 550px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
    .analysis-icon { font-size: 48px; margin-bottom: 20px; }
    .analysis-input { width: 100%; padding: 14px 18px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 16px; transition: border-color 0.2s; }
    .analysis-input:focus { border-color: var(--accent); }
    .btn-execute { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-execute:hover { background: #005f8a; }
    
    /* 進度條樣式 */
    .loading-state { display: none; flex-direction: column; align-items: center; width: 100%; margin-top: 25px; }
    .progress-container { width: 100%; background: var(--bg); height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.5s ease; }
    .status-msg { font-size: 14px; color: var(--accent); font-weight: 500; min-height: 24px; }

    /* 保留原始聊天樣式 */
    .chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .welcome-card { background: linear-gradient(135deg, #e6f3fb, #f0f9ff); border: 1px solid rgba(0,119,182,0.15); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 8px; }
    .msg-bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.7; word-break: break-word; }
    .msg-bubble.ai { background: var(--bubble-ai); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
    .msg-bubble.user { background: var(--bubble-usr); color: #fff; border-bottom-right-radius: 4px; }
    .msg-row { display: flex; gap: 10px; animation: msgIn 0.25s ease both; }
    .msg-row.user { flex-direction: row-reverse; }
    .input-area { padding: 16px 24px; border-top: 1px solid var(--border); flex-shrink: 0; background: #fff; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 14px; }
    #chatInput { flex: 1; background: none; border: none; outline: none; font-size: 14px; resize: none; max-height: 120px; }
  </style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-row"><div class="brand-icon">S</div><div class="brand-name">SYNMOSA</div></div>
      <div class="brand-sub">健喬信元醫藥集團</div>
    </div>
    <div class="user-card">
      <div class="user-avatar" id="userAvatar">--</div>
      <div><div class="user-name" id="userName">載入中...</div><div class="user-role">內部員工</div></div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">工作區</div>
      <button class="nav-item active" id="nav-sales" onclick="showMode('sales')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        業績查詢 <span class="nav-badge" id="msgCount">0</span>
      </button>

      <button class="nav-item" id="nav-biotech" onclick="showMode('biotech')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        泛生技產業分析
      </button>

      <div class="nav-section-label" style="margin-top:8px;">說明</div>
      <button class="nav-item" onclick="sendQuick('我可以查詢哪些資料？')">使用說明</button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">登出系統</button>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <div>
        <div class="header-title" id="headerTitle">業績查詢助理</div>
        <div class="header-sub" id="headerSub">AI 智能查詢 · 即時回應</div>
      </div>
      <div class="header-right">
        <div class="status-pill"><div class="status-dot"></div>AI 服務正常</div>
      </div>
    </header>

    <div id="sales-view" style="display: flex; flex-direction: column; flex: 1;">
      <div class="chat-area" id="chatArea">
        <div class="welcome-card">
          <div class="welcome-title" id="welcomeTitle">👋 您好，歡迎使用業績查詢系統</div>
          <div class="welcome-text">您可以直接輸入問題，AI 助理將幫您查詢業績相關資料。</div>
          <div class="quick-btns" style="margin-top:14px; display:flex; gap:8px;">
            <button class="quick-btn" onclick="sendQuick('2025年業績最好的商品是哪個？')" style="padding:7px 14px; border-radius:20px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; font-size:12px;">🏆 最佳商品</button>
          </div>
        </div>
        <div class="typing-indicator" id="typingIndicator" style="display:none;">AI 正在思考中...</div>
      </div>
      <div class="input-area">
        <div class="input-row">
          <textarea id="chatInput" placeholder="輸入您的問題..." rows="1"></textarea>
          <button class="btn-send" id="sendBtn" onclick="sendMessage()" style="background:var(--accent); border:none; padding:8px 12px; border-radius:8px; color:#fff; cursor:pointer;">送出</button>
        </div>
      </div>
    </div>

    <div id="biotech-view" class="analysis-panel">
      <div class="analysis-card">
        <div class="analysis-icon">🧬</div>
        <h2 style="font-size: 20px; margin-bottom: 10px;">泛生技產業整合分析</h2>
        <p style="font-size: 14px; color: var(--text-mid); margin-bottom: 25px;">輸入關鍵字，AI 將搜尋最新生技資訊並寄送詳細報告至您的信箱。</p>
        
        <input type="text" id="biotechKeyword" class="analysis-input" placeholder="請輸入分析主題，如：台灣新藥研發趨勢">
        <button class="btn-execute" id="executeBtn" onclick="runBiotechWorkflow()">啟動分析並寄送郵件</button>

        <div class="loading-state" id="loadingState">
          <div class="status-msg" id="statusMsg">系統準備中...</div>
          <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
          <p style="font-size: 12px; color: var(--text-dim);">此過程包含深度搜尋與 AI 彙整，約需 60-90 秒。</p>
        </div>
        <div id="completeMsg" style="display:none; color: var(--success); font-weight: 600; margin-top: 20px;">✅ 報告已成功生成並寄出！</div>
      </div>
    </div>
  </main>
</div>

<script>
  // 設定區
  const N8N_CHAT_URL = 'https://rick0740-n8n-free.hf.space/webhook/3335c50c-f72c-4cbe-8554-7e397390ba38/chat';
  const BIOTECH_WEBHOOK = 'https://rick0740-n8n-free.hf.space/webhook/3335c50c-f72c-4cbe-8554-7e397390ba38/chat'; // 這裡請替換為您 Publish 後的 Webhook URL
  const LOGIN_URL = 'https://rick0740.github.io/n8n/';

  // 驗證
  const token = sessionStorage.getItem('auth_token');
  const username = sessionStorage.getItem('auth_user') || "rick0740";
  if (!token) { /* window.location.href = LOGIN_URL; */ }

  document.getElementById('userName').textContent = username;
  document.getElementById('userAvatar').textContent = username.slice(0, 2).toUpperCase();

  // 模式切換邏輯
  function showMode(mode) {
    const salesView = document.getElementById('sales-view');
    const biotechView = document.getElementById('biotech-view');
    const headerTitle = document.getElementById('headerTitle');
    const navSales = document.getElementById('nav-sales');
    const navBiotech = document.getElementById('nav-biotech');

    if (mode === 'biotech') {
      salesView.style.display = 'none';
      biotechView.style.display = 'flex';
      headerTitle.textContent = '泛生技產業分析';
      navSales.classList.remove('active');
      navBiotech.classList.add('active');
    } else {
      salesView.style.display = 'flex';
      biotechView.style.display = 'none';
      headerTitle.textContent = '業績查詢助理';
      navSales.classList.add('active');
      navBiotech.classList.remove('active');
    }
  }

  // 🆕 生技分析工作流執行
  async function runBiotechWorkflow() {
    const keyword = document.getElementById('biotechKeyword').value.trim();
    if (!keyword) return alert("請輸入分析關鍵字");

    const loadingState = document.getElementById('loadingState');
    const executeBtn = document.getElementById('executeBtn');
    const statusMsg = document.getElementById('statusMsg');
    const progressBar = document.getElementById('progressBar');
    const completeMsg = document.getElementById('completeMsg');

    executeBtn.disabled = true;
    loadingState.style.display = 'flex';
    completeMsg.style.display = 'none';

    // 模擬人性化進度
    const steps = [
      { t: "🔍 正在透過 Tavily 搜尋全球生技數據...", p: "20%" },
      { t: "🌐 正在擷取 Jina.ai 網頁深度內容...", p: "45%" },
      { t: "🧠 AI 正在進行產業趨勢結構化分析...", p: "70%" },
      { t: "✉️ 正在產生報告並寄送至 Gmail...", p: "90%" }
    ];

    let currentStep = 0;
    const stepInterval = setInterval(() => {
      if (currentStep < steps.length) {
        statusMsg.textContent = steps[currentStep].t;
        progressBar.style.width = steps[currentStep].p;
        currentStep++;
      }
    }, 4000); // 每 4 秒跳一個階段

    try {
      const res = await fetch(BIOTECH_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatInput: `請分析並寄送郵件，主題：${keyword}`, sessionId: token })
      });
      
      clearInterval(stepInterval);
      if (res.ok) {
        progressBar.style.width = "100%";
        statusMsg.textContent = "任務完成！";
        completeMsg.style.display = 'block';
        setTimeout(() => { loadingState.style.display = 'none'; executeBtn.disabled = false; }, 3000);
      }
    } catch (err) {
      clearInterval(stepInterval);
      alert("連線失敗，請稍後再試。");
      executeBtn.disabled = false;
      loadingState.style.display = 'none';
    }
  }

  // 保留原有的業績查詢 JS 邏輯
  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    // ... (這裡請接您原本的 addMessage 與 fetch 邏輯)
  }

  function sendQuick(msg) {
    document.getElementById('chatInput').value = msg;
    sendMessage();
  }

  function logout() {
    if (confirm('確定要登出嗎？')) {
      sessionStorage.clear();
      window.location.href = LOGIN_URL;
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYNMOSA 健喬信元 — 業務與產業分析系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ... 保留原有樣式 ... */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f2f5; --sidebar: #ffffff; --border: #e2e8f0; --accent: #0077b6;
      --accent-lt: #e6f3fb; --accent-2: #00b4d8; --text: #1a202c; --text-mid: #4a5568;
      --text-dim: #a0aec0; --bubble-ai: #f7f9fc; --bubble-usr: #0077b6;
      --success: #38a169; --danger: #e53e3e; --radius: 12px;
    }
    html, body { height: 100%; font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    .layout { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
    .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
    .sidebar-header { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
    .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .brand-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; flex-shrink: 0; }
    .brand-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: 0.05em; }
    .brand-sub { font-size: 11px; color: var(--text-dim); margin-left: 42px; }
    .user-card { margin: 16px 20px; background: var(--accent-lt); border: 1px solid rgba(0,119,182,0.15); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 500; color: var(--accent); }
    .user-role { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
    .sidebar-nav { flex: 1; padding: 8px 12px; overflow-y: auto; }
    .nav-section-label { font-size: 10px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 8px 6px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-mid); transition: background 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: var(--accent-lt); color: var(--accent); font-weight: 500; }
    .nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
    .btn-logout { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--text-mid); font-size: 13px; cursor: pointer; }
    .main { display: flex; flex-direction: column; height: 100vh; background: #fff; position: relative; }
    .main-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .header-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .status-pill { display: flex; align-items: center; gap: 6px; background: #f0fff4; border: 1px solid rgba(56,161,105,0.2); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: var(--success); font-weight: 500; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* 🆕 新增：執行中心專屬樣式 */
    .analysis-container { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px; text-align: center; }
    .analysis-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 500px; width: 100%; }
    .analysis-title { font-size: 20px; font-weight: 600; color: var(--accent); margin-bottom: 12px; }
    .analysis-desc { font-size: 14px; color: var(--text-mid); margin-bottom: 24px; line-height: 1.6; }
    .analysis-input-group { position: relative; width: 100%; margin-bottom: 16px; }
    .analysis-input { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .analysis-input:focus { border-color: var(--accent); }
    .btn-execute { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; transition: transform 0.1s; }
    .btn-execute:active { transform: scale(0.98); }

    /* 🆕 人性化等待樣式 */
    .loading-view { display: none; flex-direction: column; align-items: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--accent-lt); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .progress-bar { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin: 15px 0; }
    .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.5s; }
    .status-text { font-size: 14px; color: var(--accent); font-weight: 500; }
    
    /* 其他原有 Chat 樣式 ... */
    .chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .input-area { padding: 16px 24px; border-top: 1px solid var(--border); flex-shrink: 0; background: #fff; }
    .nav-badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <div class="brand-icon">S</div>
        <div class="brand-name">SYNMOSA</div>
      </div>
      <div class="brand-sub">健喬信元醫藥集團</div>
    </div>

    <div class="user-card">
      <div class="user-avatar" id="userAvatar">--</div>
      <div>
        <div class="user-name" id="userName">載入中...</div>
        <div class="user-role">內部員工</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">工作區</div>
      <button class="nav-item active" onclick="switchMode('chat')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        業績查詢
        <span class="nav-badge" id="msgCount">0</span>
      </button>

      <button class="nav-item" id="nav-biotech" onclick="switchMode('biotech')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/>
        </svg>
        泛生技產業分析
      </button>

      <div class="nav-section-label" style="margin-top:8px;">說明</div>
      <button class="nav-item" onclick="sendQuick('我可以查詢哪些資料？')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        使用說明
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        登出系統
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <div>
        <div class="header-title" id="main-title">業績查詢助理</div>
        <div class="header-sub" id="main-sub">AI 智能查詢 · 即時回應</div>
      </div>
      <div class="header-right">
        <div class="status-pill"><div class="status-dot"></div> AI 服務正常</div>
      </div>
    </header>

    <div id="chat-wrapper" style="display: flex; flex-direction: column; height: 100%;">
      <div class="chat-area" id="chatArea">
        <div class="welcome-card">
          <div class="welcome-title" id="welcomeTitle">👋 您好，歡迎使用系統</div>
          <div class="welcome-text">您可以直接輸入問題，AI 助理將幫您查詢業績相關資料。</div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
          <div class="msg-avatar ai">AI</div>
          <div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
        </div>
      </div>
      <div class="input-area">
        <div class="input-row">
          <textarea id="chatInput" placeholder="輸入您的問題..." rows="1"></textarea>
          <button class="btn-send" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="biotech-wrapper" class="analysis-container">
      <div class="analysis-card" id="biotech-input-view">
        <div class="analysis-title">泛生技產業深度分析</div>
        <p class="analysis-desc">整合全球數據與 AI 摘要，為您提供精準的市場分析報告。結果將自動發送至您的信箱。</p>
        <div class="analysis-input-group">
          <input type="text" id="biotech-query" class="analysis-input" placeholder="例如：新藥開發趨勢、健喬信元市場競爭...">
        </div>
        <button class="btn-execute" onclick="executeBiotechWorkflow()">開始執行分析</button>
      </div>

      <div class="loading-view" id="biotech-loading-view">
        <div class="spinner"></div>
        <div class="status-text" id="status-text">正在初始化搜尋引擎...</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <p style="font-size: 12px; color: var(--text-dim); margin-top: 10px;">這可能需要 1-2 分鐘，請勿關閉視窗</p>
      </div>

      <div id="biotech-complete-view" style="display:none;">
        <div style="font-size: 50px; margin-bottom: 20px;">✅</div>
        <div class="analysis-title">分析任務已啟動</div>
        <p class="analysis-desc">AI 正在背景努力產出中，報告產出後將立即發送至您的 Gmail 信箱。您可以繼續進行其他查詢。</p>
        <button class="btn-execute" style="background: var(--text-mid);" onclick="switchMode('chat')">返回工作區</button>
      </div>
    </div>
  </main>
</div>

<script>
  // ============================================
  // ⚙️ 設定區
  // ============================================
  const N8N_CHAT_URL = 'https://rick0740-n8n-free.hf.space/webhook/3335c50c-f72c-4cbe-8554-7e397390ba38/chat';
  const BIOTECH_WEBHOOK_URL = 'https://rick0740-n8n-free.hf.space/webhook/biotech-analysis'; // 需點擊 Publish 後的 Production URL
  // ============================================

  // 原有驗證與顯示邏輯...
  const username = sessionStorage.getItem('auth_user') || "內部員工";
  document.getElementById('userName').textContent = username;
  document.getElementById('userAvatar').textContent = username.slice(0, 2).toUpperCase();
  document.getElementById('welcomeTitle').textContent = `👋 ${username}，歡迎使用系統`;

  // 模式切換邏輯
  function switchMode(mode) {
    const chatWrap = document.getElementById('chat-wrapper');
    const bioWrap = document.getElementById('biotech-wrapper');
    const navItems = document.querySelectorAll('.nav-item');
    
    // UI 重置
    navItems.forEach(i => i.classList.remove('active'));
    
    if (mode === 'biotech') {
      chatWrap.style.display = 'none';
      bioWrap.style.display = 'flex';
      document.getElementById('nav-biotech').classList.add('active');
      document.getElementById('main-title').textContent = '泛生技產業整合分析';
      document.getElementById('main-sub').textContent = '深度搜尋 · AI 結構化報告';
    } else {
      chatWrap.style.display = 'flex';
      bioWrap.style.display = 'none';
      navItems[0].classList.add('active');
      document.getElementById('main-title').textContent = '業績查詢助理';
      document.getElementById('main-sub').textContent = 'AI 智能查詢 · 即時回應';
    }
  }

  // 執行 Webhook 邏輯與人性化等待
  async function executeBiotechWorkflow() {
    const keyword = document.getElementById('biotech-query').value.trim();
    if (!keyword) return alert("請輸入分析關鍵字");

    // 介面切換到等待狀態
    document.getElementById('biotech-input-view').style.display = 'none';
    document.getElementById('biotech-loading-view').style.display = 'flex';
    
    const statusText = document.getElementById('status-text');
    const progressFill = document.getElementById('progress-fill');

    // 虛擬進度提示輪播
    const steps = [
      { t: "正在透過 Tavily 檢索全球生技數據...", p: "20%" },
      { t: "正在使用 Jina.ai 擷取網頁深度內容...", p: "45%" },
      { t: "AI 正在進行產業結構化摘要...", p: "70%" },
      { t: "正在彙整最終報告並準備郵件...", p: "90%" }
    ];

    let currentStep = 0;
    const stepInterval = setInterval(() => {
      if (currentStep < steps.length) {
        statusText.innerText = steps[currentStep].t;
        progressFill.style.width = steps[currentStep].p;
        currentStep++;
      }
    }, 4000);

    try {
      const response = await fetch(BIOTECH_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keyword: keyword })
      });

      clearInterval(stepInterval);

      if (response.ok) {
        progressFill.style.width = "100%";
        setTimeout(() => {
          document.getElementById('biotech-loading-view').style.display = 'none';
          document.getElementById('biotech-complete-view').style.display = 'block';
        }, 800);
      } else {
        throw new Error("發送失敗");
      }
    } catch (err) {
      clearInterval(stepInterval);
      alert("系統連線異常，請確認工作流已 Publish 或網址正確。");
      document.getElementById('biotech-input-view').style.display = 'block';
      document.getElementById('biotech-loading-view').style.display = 'none';
    }
  }

  // ... 其餘原有的 sendMessage, clearChat, logout 等函式 ...
  function sendMessage() { /* 原有代碼... */ }
  function addMessage() { /* 原有代碼... */ }
  // ...
</script>
</body>
</html>
